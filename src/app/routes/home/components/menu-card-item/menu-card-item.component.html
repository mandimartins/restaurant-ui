<div class="container" *ngIf="menusItens$ | async as menuItem; else loading">
  <div class="row">
    <div class="col s12 m6 l4" *ngFor="let item of menuItem">
      <p>Teste menuItem</p>
    </div>
  </div>
</div>

<ng-template #loading>
  <div
    class="loading-container"
    style="
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    "
  >
    <p>Loading...</p>
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
